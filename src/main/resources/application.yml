spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartmeter_v2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret-0123}
    expiry-minutes: 60
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap:
    landlord-username: ${BOOT_LANDLORD_USER:landlord@example.com}
    landlord-password: ${BOOT_LANDLORD_PASS:}
    landlord-name: ${BOOT_LANDLORD_NAME:Owner}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@smartmeter.local}
  password-reset:
    expiry-minutes: 30
  support:
    product-maker-name: ${SUPPORT_NAME:Your Name}
    product-maker-email: ${SUPPORT_EMAIL:support@example.com}
    product-maker-phone: ${SUPPORT_PHONE:+91-0000000000}

mqtt:
  broker-url: ${MQTT_BROKER_URL:ssl://YOUR-CLOUD-BROKER-HOST:8883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  client-id: ${MQTT_CLIENT_ID:smartmeter-backend}
  topic-prefix: ${MQTT_TOPIC_PREFIX:meters}
  qos: 0

simulator:
  enabled: ${SIMULATOR_ENABLED:true}
  meter-count: ${SIMULATOR_METER_COUNT:20}
  interval-ms: ${SIMULATOR_INTERVAL_MS:5000}
  device-prefix: ${SIMULATOR_DEVICE_PREFIX:SIM}
